<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สเต็กน้องต๋อง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#16201A; --muted:#5B6860; --line:#D9E0DA;
  --basil:#1E5B42; --basil-ink:#FFFFFF; --basil-soft:#E1EEE6;
  --chili:#BF3B28; --chili-soft:#F8E3DF; --turmeric:#C98418; --turmeric-soft:#F8ECD6;
  --shadow:0 1px 2px rgba(22,32,26,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1512; --surface:#18211C; --ink:#E6EDE8; --muted:#97A59C; --line:#2A3630;
    --basil:#3F9B72; --basil-ink:#0B130F; --basil-soft:#1C2F25;
    --chili:#E2654F; --chili-soft:#3A1E19; --turmeric:#E3A93F; --turmeric-soft:#33281A;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18211C; --ink:#E6EDE8; --muted:#97A59C; --line:#2A3630;
  --basil:#3F9B72; --basil-ink:#0B130F; --basil-soft:#1C2F25;
  --chili:#E2654F; --chili-soft:#3A1E19; --turmeric:#E3A93F; --turmeric-soft:#33281A;
  --shadow:none; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "IBM Plex Sans Thai",system-ui,"Leelawadee UI","Sukhumvit Set",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,.num{font-family:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;font-weight:500;line-height:1.25;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--basil);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:20px}
.live{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--basil)}
.dot.off{background:var(--chili)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px 10px;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap;font-weight:500;position:relative}
.tab[aria-current="page"]{color:var(--ink);border-color:var(--basil)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--chili);color:#fff;font-size:12px;font-weight:600;margin-left:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-weight:600;background:var(--basil);color:var(--basil-ink);min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--basil-soft);color:var(--ink)}
.btn.warn{background:var(--chili);color:#fff}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.notice{padding:12px 14px;border-radius:10px;background:var(--turmeric-soft);margin-bottom:16px;font-size:15px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.section-title{font-size:18px;margin:24px 0 10px}
/* Tables */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ttile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.ttile::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--line)}
.ttile.busy::before{background:var(--basil)}
.ttile.wait::before{background:var(--turmeric)}
.ttile.alert::before{background:var(--chili)}
.ttile .tnum{font-family:"Mitr",system-ui,sans-serif;font-size:40px;line-height:1;font-weight:500}
.ttile .tnum.word{font-size:26px}
.ttile .tstate{font-size:14px;color:var(--muted)}
.ttile .tamt{font-weight:600;font-size:17px}
/* Menu picker */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px;position:relative}
.item .iname{font-weight:500;line-height:1.35}
.item .iprice{color:var(--muted);margin-top:auto}
.item .iqty{position:absolute;top:8px;right:8px;background:var(--basil);color:var(--basil-ink);border-radius:12px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px;font-weight:600;padding:0 7px}
.item.off{opacity:.45}
.item.off .iprice::after{content:"  หมด";color:var(--chili);font-weight:600}
.bar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);margin-top:16px;z-index:4}
.bar .btn{width:100%;justify-content:space-between;padding:14px 18px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.sent{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.ticket-mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.status{display:inline-block;padding:2px 10px;border-radius:10px;font-size:13px;font-weight:600}
.st-new{background:var(--turmeric-soft);color:var(--turmeric)}
.st-cooking{background:var(--chili-soft);color:var(--chili)}
.st-served{background:var(--basil-soft);color:var(--basil)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;padding:6px 0;min-height:40px}
/* Kitchen */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.kcard{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--turmeric);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.kcard.cooking{border-top-color:var(--chili)}
.kcard .khead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kcard .ktable{font-family:"Mitr",system-ui,sans-serif;font-size:22px}
.kcard .kage{font-weight:600}
.kcard .kage.late{color:var(--chili)}
.kcard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.kcard li{display:flex;gap:10px;font-size:17px}
.kcard li b{min-width:30px;font-family:"Mitr",system-ui,sans-serif;font-weight:500}
.knote{display:block;color:var(--chili);font-size:14px}
.src{font-size:13px;color:var(--muted)}
/* Lists */
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .grow{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:14px;font-weight:500;color:var(--muted)}
.field input,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggle{padding:4px 12px;border-radius:14px;font-size:13px;font-weight:600;min-height:32px}
.toggle.on{background:var(--basil-soft);color:var(--basil)}
.toggle.off{background:var(--chili-soft);color:var(--chili)}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:88vh}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:20px}
.sheet-body{overflow-y:auto;padding:12px 18px;flex:1}
.sheet-foot{padding:12px 18px 16px;border-top:1px solid var(--line)}
.x{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;font-size:22px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:36px;height:36px;border-radius:18px;border:1px solid var(--line);font-size:18px;font-weight:600}
.qty span{min-width:26px;text-align:center;font-weight:600}
.note-in{width:100%;margin-top:6px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px}
.totals{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.totals .row{justify-content:space-between}
.grand{font-family:"Mitr",system-ui,sans-serif;font-size:28px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0}
.seg button{padding:10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;background:#fff;border-radius:12px;color:#16201A}
.qrbox .qr{width:220px;height:220px}
.qr img,.qr canvas{width:100%!important;height:auto!important;display:block}
/* Report */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat .v{font-family:"Mitr",system-ui,sans-serif;font-size:28px;line-height:1.2}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:160px;margin-top:8px}
.bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px;color:var(--muted)}
.bfill{width:100%;max-width:44px;background:var(--basil-soft);border-radius:6px 6px 2px 2px;min-height:3px}
.bcol.sel .bfill{background:var(--basil)}
.bcol.sel{color:var(--ink);font-weight:600}
.tqr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tqr .cell{background:#fff;color:#16201A;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.tqr .cell .qr{width:120px;height:120px;margin:0 auto 8px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:40;font-weight:500;max-width:90vw;text-align:center}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.cust-hero{padding:18px 16px 4px;max-width:1100px;margin:0 auto}
.cust-hero h1{font-size:26px}
.receipt{font-size:15px}
.receipt .rc{text-align:center}
.login{max-width:380px;margin:10vh auto 0}
.login h1{font-size:26px;margin-bottom:4px}
.err{color:var(--chili);font-size:14px;margin:0 0 10px}
.item.hasimg{padding:0;overflow:hidden}
.item .ithumb{aspect-ratio:4/3;background:var(--basil-soft);display:grid;place-items:center;font-size:28px;overflow:hidden}
.item .ithumb img{width:100%;height:100%;object-fit:cover;display:block}
.item.hasimg .ibody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.opthero{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-bottom:12px;display:block;background:var(--basil-soft)}
.mthumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--basil-soft)}
.ctimer{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 12px;border-radius:14px;background:var(--turmeric-soft);color:var(--turmeric);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.ctimer.low{background:var(--chili-soft);color:var(--chili)}
.expired{text-align:center;padding:28px 18px}
.expired .big{font-size:44px;line-height:1;margin-bottom:8px}
.sr-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.imgpick{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.imgprev{width:88px;height:88px;border-radius:12px;object-fit:cover;background:var(--basil-soft);display:grid;place-items:center;font-size:30px;flex:none}
.catttl{font-family:"Mitr",system-ui,sans-serif;font-weight:500;font-size:20px;margin:22px 0 10px;display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.catttl:first-of-type{margin-top:6px}
.catttl small{font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:14px;color:var(--muted);font-weight:400}
.bigbill{min-height:54px;padding:12px 22px;font-size:19px;border-radius:14px}
.kzones{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
@media (min-width:900px){.kzones{grid-template-columns:1fr 1fr}}
.kzone{border-radius:16px;padding:12px;border:2px solid var(--line)}
.kzone.znew{background:var(--turmeric-soft);border-color:var(--turmeric)}
.kzone.zcook{background:var(--basil-soft);border-color:var(--basil)}
.kzone>h3{font-family:"Mitr",system-ui,sans-serif;font-weight:500;font-size:20px;margin:2px 4px 12px;display:flex;align-items:center;gap:8px}
.kzone>h3 .cnt{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:15px;color:#fff;font-size:16px}
.znew>h3 .cnt{background:var(--turmeric)}
.zcook>h3 .cnt{background:var(--basil)}
.kzone .kgrid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.kzone .zempty{padding:18px;text-align:center;color:var(--muted)}
.kcard.knew{border-top-color:var(--turmeric)}
.kcard.kcook{border-top-color:var(--basil)}
.btn.red{background:var(--chili);color:#fff}
.btn.green{background:var(--basil);color:var(--basil-ink)}
.btn.huge{min-height:52px;font-size:18px}
.kcard.late{border-color:var(--chili);border-top-color:var(--chili);background:var(--chili-soft);box-shadow:0 0 0 2px var(--chili),0 0 18px rgba(220,60,30,.45)}
.kcard.late .kage{color:var(--chili);font-size:18px}
.fire{display:inline-block;font-size:24px;line-height:1;transform-origin:50% 90%}
@media (prefers-reduced-motion:no-preference){
  .kcard.late{animation:shake 2.4s ease-in-out infinite}
  .fire{animation:flicker .5s ease-in-out infinite alternate}
  @keyframes shake{0%,70%,100%{transform:none}73%{transform:translateX(-5px) rotate(-1deg)}76%{transform:translateX(5px) rotate(1deg)}79%{transform:translateX(-5px) rotate(-1deg)}82%{transform:translateX(5px) rotate(1deg)}85%{transform:translateX(-3px)}88%{transform:translateX(3px)}}
  @keyframes flicker{from{transform:scale(1) rotate(-4deg);filter:brightness(1)}to{transform:scale(1.18) rotate(4deg);filter:brightness(1.25)}}
}
.sumrow{padding:12px 0;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
.sumrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sumrow .qtyb{font-family:"Mitr",system-ui,sans-serif;font-size:26px;min-width:56px;text-align:right}
.sumrow .nm{font-size:18px;font-weight:600}
.sumrow .sub{color:var(--muted);font-size:14px;margin-top:2px}
.sumrow .sub b{color:var(--basil);font-weight:600}
.kcard .ktable{font-size:24px}
.kcard .src{font-size:14px}
.kcard ul.kplain li{font-size:19px;line-height:1.4}
.kcard ul.kplain li b{min-width:34px}
.kcard .knote{font-size:16px}
.kcard .kopt{font-size:16px}
ul.kticks{gap:8px}
.kitem{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:19px;line-height:1.4;min-height:56px}
.kitem b{font-family:"Mitr",system-ui,sans-serif;font-weight:500;min-width:34px}
.kitem .kbox{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-size:20px;font-weight:700;margin-top:1px;color:#fff}
.kitem.done{background:var(--basil-soft);border-color:var(--basil)}
.kitem.done .kbox{background:var(--basil);border-color:var(--basil)}
.kitem.done .kname{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.kprog{font-size:16px;font-weight:600;color:var(--basil);margin:2px 0 0}
.sdone{color:var(--basil);font-weight:600;font-size:14px}
.irow{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
.irow:first-of-type{border-top:0}
.irow .itext{flex:1;min-width:0;line-height:1.45}
.iacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.iacts .btn{min-height:36px;padding:4px 10px;font-size:14px}
.tarow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px}
.tarow .grow{flex:1;min-width:0}
.tarow .nm{font-weight:600;font-size:18px}
.mnav{display:flex;align-items:center;gap:8px}
.mnav .btn{min-width:44px;font-size:20px;padding:6px 12px}
.mnav h2{min-width:170px;text-align:center}
.dayrow{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);font-size:16px}
.dayrow:last-child{border-bottom:0}
.dayrow .dbar{height:12px;border-radius:6px;background:var(--basil);min-width:2px}
.dayrow.zero{color:var(--muted)}
.dayrow.zero .dbar{background:var(--line)}
.dayrow .damt{font-weight:600;text-align:right;white-space:nowrap}
.dayrow .damt small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.billrow{border-bottom:1px solid var(--line)}
.billrow:last-child{border-bottom:0}
.billhead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 2px;font-size:16px}
.billhead .chev{color:var(--muted);transition:transform .15s}
.billrow.open .chev{transform:rotate(90deg)}
.billbody{padding:4px 4px 14px 26px;font-size:15px}
.billbody .row{justify-content:space-between}
.billbody hr{border:0;border-top:1px dashed var(--line);margin:8px 0}
.dinechoice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.dinebtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;border:2px solid var(--line);border-radius:14px;background:var(--surface);font-weight:600;font-size:17px;min-height:88px;justify-content:center}
.dinebtn .ic{font-size:28px;line-height:1}
.dinebtn[aria-pressed="true"]{border-color:var(--basil);background:var(--basil-soft);box-shadow:inset 0 0 0 1px var(--basil)}
.rvrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:16px}
.rvrow:last-child{border-bottom:0}
.fromt{font-size:13px;color:var(--muted);font-weight:400}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function today(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(ds,n){const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return today(d)}
function baht(n){n=Math.round((Number(n)||0)*100)/100;return "฿"+n.toLocaleString("th-TH",{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2})}
function hm(ms){return new Date(ms).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})}
function tableIds(){const n=Math.max(1,Math.min(60,parseInt(S.config.tables)||10));const a=[];for(let i=1;i<=n;i++)a.push(String(i));a.push("TA");return a}
function tLabel(t){return t==="TA"?L("กลับบ้าน","Takeaway"):L("โต๊ะ ","Table ")+t}
function contactOf(o){return S.contacts[o.id]||null}
function taKey(o){const c=contactOf(o);return c?(c.phone||c.name||""):""}
function ordersFor(t){let os=S.orders.filter(o=>o.table===t);
  if(t==="TA"){if(S.customer==="TA"){const mine=S.myTA||[];os=os.filter(o=>mine.includes(o.id))}else if(S.table==="TA"&&S.ta){os=os.filter(o=>taKey(o)===S.ta.phone)}}
  return os}
function ctxLabel(t){if(t==="TA"){const c=S.customer==="TA"?S.taCust:S.ta;if(c)return L("กลับบ้าน: ","Takeaway: ")+c.name}return tLabel(t)}
function orderLabel(o){if(o.table==="TA"){const c=contactOf(o);if(c)return "กลับบ้าน: "+c.name+(c.fromTable?" (สั่งจากโต๊ะ "+c.fromTable+")":"")}return tLabel(o.table)}
function short(id){return "#"+String(id).slice(-4).toUpperCase()}
let toastTimer;
function toast(msg){let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true},2600)}
function categories(){const seen=[];S.menu.forEach(m=>{const c=m.cat||"อื่น ๆ";if(!seen.includes(c))seen.push(c)});return seen}
function menuById(id){return S.menu.find(m=>m.id===id)}

function isEN(){return !!S.customer&&S.lang==="en"}
function L(th,en){return isEN()?en:th}
function trName(m,fallback){if(!m)return fallback||"";return isEN()?(m.nameEn||EN_MAP[m.name]||m.name):m.name}
function trCat(c){return isEN()?(CAT_EN[c]||c):c}
function trOpt(o){return isEN()?(SAUCE_EN[o]||o):o}
/* sold-out resets by itself each day; paused stays until staff re-opens */
function menuState(m){if(!m)return "on";if(m.off==="pause")return "pause";if(m.off==="sold"&&m.offDate===today())return "sold";return "on"}
function isVar(m){return !!(m&&m.var)}
function mPrice(m,ta){if(!m)return 0;if(ta&&m.priceTA!=null&&m.priceTA!=="")return Number(m.priceTA)||0;return Number(m.price)||0}
function rangeTxt(m,ta){if(!m)return "";const a=ta&&m.pMinTA!=null?m.pMinTA:m.pMin,b=ta&&m.pMaxTA!=null?m.pMaxTA:m.pMax;return "฿"+a+"–"+b}
function priceTxt(m,ta){return isVar(m)?rangeTxt(m,ta):baht(mPrice(m,ta))}
function taCtx(){return S.customer==="TA"||(!S.customer&&S.table==="TA")}
function parseChoice(c){const mm=String(c).match(/^(.*?)(?:\s*\+\s*(\d+(?:\.\d+)?))?\s*(?:@\s*(.*))?$/)||[];return {label:(mm[1]||"").trim(),add:Number(mm[2]||0),kw:(mm[3]||"").trim()}}
function optAdd(label){if(!label)return 0;const c=sauceCfg().choices.map(parseChoice).find(x=>x.label===label);return c?c.add:0}
/* prices always come from the current menu (customer phones can't set prices); variable-price items are priced by staff at billing */
function linePrice(o,it){const m=menuById(it.mid);if(it.var||isVar(m))return null;const ta=o.table==="TA"||!!it.ta;
  const base=m?mPrice(m,ta):(o.source==="customer"?0:Number(it.price)||0);return base+optAdd(it.opt)}
function cartUnit(l,ta){const m=menuById(l.mid);if(isVar(m))return null;return mPrice(m,ta)+optAdd(l.opt)}
function priceSteps(lo,hi){const a=[];if(!(lo>=0)||!(hi>=lo))return a;for(let v=lo;v<hi&&a.length<40;v+=5)a.push(v);a.push(hi);return a}

function lineName(o,it){if(o.source==="customer"){const m=menuById(it.mid);return m?m.name:String(it.name||"")}return it.name}
function billLines(t){const map=new Map();const out=[];
  ordersFor(t).forEach(o=>(o.items||[]).forEach((it,idx)=>{const q=Math.max(0,Math.min(99,parseInt(it.qty)||0));if(!q)return;
    const ta=o.table==="TA"||!!it.ta;const name=lineName(o,it);const opt=it.opt||"";const m=menuById(it.mid);
    if(it.var||isVar(m)){const key=o.id+":"+idx;const raw=S.form.vp?S.form.vp[key]:null;const p=raw===""||raw==null?null:Number(raw);
      const lo=m?Number(ta&&m.pMinTA!=null?m.pMinTA:m.pMin):null,hi=m?Number(ta&&m.pMaxTA!=null?m.pMaxTA:m.pMax):null;
      out.push({name,opt,qty:q,ta,price:p!=null&&p>=0?p+optAdd(opt):null,base:p,vkey:key,range:m?rangeTxt(m,ta):"",lo,hi});return}
    const price=linePrice(o,it);const k=it.mid+"|"+price+"|"+opt+"|"+(ta?1:0);const cur=map.get(k);if(cur)cur.qty+=q;else map.set(k,{name,price,qty:q,opt,ta})}));
  return [...map.values(),...out]}
function lineTxt(l,hideTA){return esc(l.name)+(l.opt?' <span class="muted">('+esc(l.opt)+(optAdd(l.opt)?" +"+optAdd(l.opt):"")+")</span>":"")+(l.ta&&!hideTA?' <span class="tatag">🛍️ กลับบ้าน</span>':"")}
function calc(lines,discount){const sub=lines.reduce((s,l)=>s+(l.price==null?0:l.price*l.qty),0);const disc=Math.min(sub,Math.max(0,Number(discount)||0));const base=sub-disc;const svc=Math.round(base*(Number(S.config.service)||0))/100;const vat=Math.round((base+svc)*(Number(S.config.vat)||0))/100;return {sub,disc,svc,vat,total:Math.round((base+svc+vat)*100)/100}}
function cartTotal(ta){if(ta==null)ta=taCtx();return S.cart.reduce((s,l)=>{const u=cartUnit(l,ta);return s+(u==null?0:u*l.qty)},0)}
function cartCount(){return S.cart.reduce((s,l)=>s+l.qty,0)}
function isStaff(){return !!S.user}
function custLimitMs(){const m=Number(S.config.custMinutes);return m>0?m*60000:0}
function custLeft(){const L=custLimitMs();return L?L-(Date.now()-S.custStart):Infinity}

function sauceCfg(){const g=S.config.sauce||DEF_SAUCE;let ch=Array.isArray(g.choices)?g.choices.slice():[];let cat=String(g.cat||"");
  if(!g.v2)ch=ch.map(c=>c.trim()==="มายองเนส"?"มายองเนส @เกล็ดขนมปัง":c);

  return {cat,cats:cat.split(",").map(x=>x.trim()).filter(Boolean),title:g.title||"เลือกซอส",choices:ch}}
function optGroupFor(m){const g=sauceCfg();if(!m||!g.choices.length||!g.cats.includes(m.cat||"อื่น ๆ")||m.noOpt)return null;

/* PromptPay (EMVCo) */
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}}return c.toString(16).toUpperCase().padStart(4,"0")}
function tlv(id,v){return id+String(v.length).padStart(2,"0")+v}
function promptpay(target,amount){let t=String(target||"").replace(/\D/g,""),tag;
  if(t.length===10&&t[0]==="0"){t="0066"+t.slice(1);tag="01"}else if(t.length===13)tag="02";else if(t.length===15)tag="03";else return null;
  let p=tlv("00","01")+tlv("01",amount?"12":"11")+tlv("29",tlv("00","A000000677010111")+tlv(tag,t))+tlv("58","TH")+tlv("53","764")+(amount?tlv("54",amount.toFixed(2)):"")+"6304";
  return p+crc16(p)}
function siteBase(){return location.origin+location.pathname}
function tableLink(t){return siteBase()+"#"+(t==="TA"?"ta":"t"+t)}

/* sound */
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();
  const comp=actx.createDynamicsCompressor();comp.connect(actx.destination);
  [[0,988],[0.17,1319],[0.34,988],[0.85,988],[1.02,1319],[1.19,988]].forEach(([off,f])=>{const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=f;o.connect(g);g.connect(comp);const t=actx.currentTime+off;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.9,t+0.01);g.gain.setValueAtTime(0.9,t+0.12);g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);o.start(t);o.stop(t+0.16)})}catch(e){}}

/* ---------- routing ---------- */
function readHash(){const h=(location.hash||"").slice(1).toLowerCase();
  const m=h.match(/^t(\d{1,2})$/);
  if(m){S.customer=String(parseInt(m[1]));return}
  if(h==="ta"){S.customer="TA";return}
  S.customer=null;S.view=VIEWS.includes(h)?h:"pos"}
function go(v){S.view=v;S.table=null;S.sheet=null;try{history.replaceState(null,"","#"+v)}catch(e){}if(v==="report")subSales();if(v==="setup")S.setupLoaded=false;render();window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>{const was=S.customer;readHash();if(was&&!S.customer){S.table=null;S.ta=null;S.cart=[];S.sheet=null}if(S.customer&&S.customer!==was)S.custStart=Date.now();subOrders();if(S.view==="report")subSales();render()});
readHash();

/* ---------- render ---------- */
function render(){
  const ae=document.activeElement;let fid=null,ss=null,se=null;
  if(ae&&ae.id&&/INPUT|TEXTAREA/.test(ae.tagName)){fid=ae.id;try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e){}}
  const sb=document.querySelector(".sheet-body");const sTop=sb?sb.scrollTop:0;const wy=window.scrollY;
  let html="";
  const ready=S.authReady&&S.got.c&&S.got.m;
  if(!ready){html='<div class="empty">กำลังโหลด…</div>'}
  else if(S.customer){html=viewCustomer()}
  else if(!isStaff()){html=viewLogin()}
  else{html=topbar()+'<main class="wrap">'+({pos:S.table?viewTable:viewPos,kitchen:viewKitchen,menu:viewMenu,report:viewReport,setup:viewSetup}[S.view])()+"</main>"}
  if(S.customer&&ready)html+='<button class="langfab" data-a="lang" aria-label="'+(S.lang==="en"?"เปลี่ยนเป็นภาษาไทย":"Switch to English")+'">'+(S.lang==="en"?"🇹🇭 ไทย":"🇬🇧 EN")+"</button>";
  html+=sheetHtml();
  document.documentElement.lang=isEN()?"en":"th";
  app.innerHTML=html;
  document.body.style.overflow=S.sheet?"hidden":"";
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}}}
  const nb=document.querySelector(".sheet-body");if(nb)nb.scrollTop=sTop;
  window.scrollTo(0,wy);
  drawQrs();
}
function drawQrs(){if(typeof QRCode==="undefined")return;document.querySelectorAll("[data-qr]").forEach(el=>{const txt=el.getAttribute("data-qr");if(!txt)return;el.innerHTML="";try{new QRCode(el,{text:txt,width:512,height:512,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M})}catch(e){el.textContent="สร้าง QR ไม่สำเร็จ"}})}

     const ta=taCtx();const pTA=!ta&&!isVar(m)&&m.priceTA!=null&&m.priceTA!==""&&Number(m.priceTA)!==Number(m.price);

function kCard(o){const age=Math.max(0,Math.floor((Date.now()-o.createdAt)/60000));const late=age>=lateMin();const isNew=o.status==="new";
  const items=o.items||[];const sm=servedMap(o);const done=servedCount(o);

/* report */
function monthRange(ym){const [y,m]=ym.split("-").map(Number);const last=new Date(y,m,0).getDate();return [ym+"-01",ym+"-"+String(last).padStart(2,"0"),last]}
function viewReport(){
  const ym=S.reportMonth;const [st,en,last]=monthRange(ym);const td=today();
  const ms=S.sales.filter(x=>x.date>=st&&x.date<=en);
  const total=ms.reduce((a,x)=>a+(x.total||0),0);const cnt=ms.length;
  const byDay={};ms.forEach(x=>{const r=byDay[x.date]||(byDay[x.date]={v:0,n:0});r.v+=x.total||0;r.n++});
  const daysWith=Object.keys(byDay).length;const best=Object.entries(byDay).sort((a,b)=>b[1].v-a[1].v)[0];
  const byM={cash:0,promptpay:0};ms.forEach(x=>{byM[x.method]=(byM[x.method]||0)+(x.total||0)});
  const it=new Map();ms.forEach(x=>(x.items||[]).forEach(i=>{const c=it.get(i.name)||{q:0,v:0};c.q+=i.qty;c.v+=i.qty*i.price;it.set(i.name,c)}));const top=[...it.entries()].sort((a,b)=>b[1].q-a[1].q).slice(0,10);
  const label=new Date(st+"T12:00:00").toLocaleDateString("th-TH",{month:"long",year:"numeric"});
  const isCur=ym===td.slice(0,7);const lastDay=isCur?parseInt(td.slice(8)):last;
  const max=Math.max(1,...Object.values(byDay).map(r=>r.v));
  const rows=[];for(let d=lastDay;d>=1;d--){const ds=ym+"-"+String(d).padStart(2,"0");const r=byDay[ds]||{v:0,n:0};
    rows.push('<button class="dayrow'+(r.v?"":" zero")+'" data-a="day" data-d="'+ds+'"><span>'+new Date(ds+"T12:00:00").toLocaleDateString("th-TH",{weekday:"short",day:"numeric"})+(ds===td?' <span class="tag">วันนี้</span>':"")+'</span><span class="dbar" style="width:'+Math.max(1,Math.round(r.v/max*100))+'%"></span><span class="damt">'+baht(r.v)+"<small>"+r.n+" บิล</small></span></button>")}
  return '<div class="row between wrapflex" style="margin-bottom:14px"><div class="mnav"><button class="btn ghost" data-a="month" data-d="-1" aria-label="เดือนก่อน">‹</button><h2>'+label+'</h2><button class="btn ghost" data-a="month" data-d="1" aria-label="เดือนถัดไป"'+(isCur?" disabled":"")+'>›</button></div><button class="btn ghost small" data-a="csvMonth"'+(cnt?"":" disabled")+">ส่งออก CSV ทั้งเดือน</button></div>"+
   '<div class="stats"><div class="panel stat"><div class="muted small">ยอดขายทั้งเดือน</div><div class="v">'+baht(total)+'</div></div><div class="panel stat"><div class="muted small">จำนวนบิล</div><div class="v">'+cnt+'</div></div><div class="panel stat"><div class="muted small">เฉลี่ยต่อวันที่เปิดขาย</div><div class="v">'+baht(daysWith?total/daysWith:0)+'</div></div><div class="panel stat"><div class="muted small">วันที่ขายดีที่สุด</div><div class="v" style="font-size:20px">'+(best?new Date(best[0]+"T12:00:00").toLocaleDateString("th-TH",{day:"numeric",month:"short"})+" "+baht(best[1].v):"-")+"</div></div></div>"+
   '<p class="muted" style="margin:10px 2px">เงินสด '+baht(byM.cash||0)+"  พร้อมเพย์ "+baht(byM.promptpay||0)+"</p>"+
   '<h2 class="section-title">ยอดขายรายวัน <span class="muted small" style="font-weight:400">แตะวันที่เพื่อดูบิลทั้งหมด</span></h2><div class="panel" style="padding:4px 14px">'+(rows.length?rows.join(""):'<div class="empty">ไม่มีข้อมูล</div>')+"</div>"+
   '<h2 class="section-title">เมนูขายดีประจำเดือน</h2><div class="panel list" style="padding:0 16px">'+(top.length?top.map(([n,c],i)=>'<div class="lrow"><span class="muted" style="width:22px">'+(i+1)+'</span><span class="grow">'+esc(n)+'</span><span>'+c.q+' จาน</span><span class="muted" style="min-width:80px;text-align:right">'+baht(c.v)+"</span></div>").join(""):'<div class="empty">ยังไม่มีการขายในเดือนนี้</div>')+"</div>"+
   '<div style="margin:36px 0 8px;text-align:center"><button class="btn ghost" style="color:var(--chili)" data-a="resetOpen">🗑 ลบข้อมูลยอดขาย</button><p class="muted small" style="margin:6px 0 0">ใช้ลบข้อมูลทดสอบ หรือบิลที่บันทึกผิด</p></div>'}

function shrinkImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{try{const max=360;let w=im.naturalWidth,h=im.naturalHeight;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
    let q=0.75,d=c.toDataURL("image/jpeg",q);while(d.length>120000&&q>0.35){q-=0.1;d=c.toDataURL("image/jpeg",q)}
    URL.revokeObjectURL(url);res(d)}catch(err){URL.revokeObjectURL(url);rej(err)}};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("load"))};im.src=url})}
document.addEventListener("change",async e=>{const el=e.target;if(el.id!=="mFile"||!el.files||!el.files[0])return;
  S.imgBusy=true;render();
  try{S.form.mImg=await shrinkImage(el.files[0]);toast("ได้รูปแล้ว กดบันทึกเพื่อใช้รูปนี้")}catch(err){toast("เปิดรูปนี้ไม่ได้ ลองเลือกรูปอื่น")}
  S.imgBusy=false;render()});
document.addEventListener("input",e=>{const el=e.target;const k=el.dataset&&el.dataset.f;if(!k)return;
  if(k.startsWith("note:")){const i=+k.slice(5);if(S.cart[i])S.cart[i].note=el.value;return}
  if(k==="rsDate"){if(S.reset){S.reset.date=el.value;render()}return}
  if(k==="rsAck"){if(S.reset){S.reset.ack=el.checked;render()}return}
  if(k==="rsWord"){S.form.rsWord=el.value;render();return}
  if(k.startsWith("vp:")){S.form.vp=S.form.vp||{};S.form.vp[k.slice(3)]=el.value;render();return}
  if(el.type==="checkbox"){S.form[k]=el.checked;if(k==="mVar")render();return}
  S.form[k]=el.value;
  if(k==="discount"||k==="received"||k==="sPp"||k==="mCat")render()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target&&(e.target.id==="lPw"||e.target.id==="lEmail")){const b=document.querySelector('[data-a="login"]');if(b)b.click()}});

function downloadFile(name,data,type){const blob=new Blob([data],{type});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function dlQr(){const cells=[...document.querySelectorAll(".tqr [data-qr]")].map(el=>{const c=el.querySelector("canvas");const img=el.querySelector("img");const src=c?c.toDataURL("image/png"):(img?img.src:"");return '<div class="c"><img src="'+src+'"><h2>'+esc(tLabel(el.dataset.t))+"</h2><p>สแกนเพื่อสั่งอาหาร</p></div>"}).join("");
  const html='<!doctype html><html lang="th"><head><meta charset="utf-8"><title>QR โต๊ะ '+esc(S.config.shopName)+'</title><style>body{font-family:sans-serif;margin:16px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.c{border:1px solid #ccc;border-radius:12px;padding:16px;text-align:center;break-inside:avoid}.c img{width:100%;max-width:220px}h2{margin:8px 0 0}p{margin:4px 0 0;color:#555}</style></head><body><h1>'+esc(S.config.shopName)+'</h1><div class="g">'+cells+"</div></body></html>";
  downloadFile("qr-tables.html",html,"text/html")}
function salesCsv(list,name){const rows=[["วันที่","เวลา","โต๊ะ/ลูกค้า","เบอร์โทร","รายการ","รวม","ส่วนลด","เซอร์วิส","VAT","ยอดชำระ","วิธีชำระ"]];
  list.slice().sort((a,b)=>a.paidAt-b.paidAt).forEach(x=>rows.push([x.date,hm(x.paidAt),x.tableLabel,x.custPhone||"",(x.items||[]).map(i=>i.qty+"x "+i.name+(i.opt?" ("+i.opt+")":"")).join("; "),x.subtotal,x.discount||0,x.service||0,x.vat||0,x.total,x.method==="promptpay"?"พร้อมเพย์":"เงินสด"]));
  downloadFile(name,"\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n"),"text/csv")}

/* ---------- subscriptions ---------- */
function subSales(){if(!isStaff())return;const [st,en]=monthRange(S.reportMonth);if(S.salesFor===st)return;if(S.salesUnsub)S.salesUnsub();S.salesFor=st;S.sales=[];
  S.salesUnsub=onSnapshot(query(col("sales"),where("date",">=",st),where("date","<=",en)),snap=>{S.sales=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(S.view==="report")render()},err=>console.error(err))}
function subOrders(){
  const key=isStaff()&&!S.customer?"all":(S.customer?"t:"+S.customer:null);
  if(key===S.ordersKey)return;
  if(S.ordersUnsub){S.ordersUnsub();S.ordersUnsub=null}
  S.ordersKey=key;S.orders=[];S.firstOrders=true;
  if(!key){render();return}
  const q=key==="all"?col("orders"):query(col("orders"),where("table","==",S.customer));
  S.ordersUnsub=onSnapshot(q,s=>{
    if(!S.firstOrders&&S.sound&&!S.customer&&s.docChanges().some(c=>c.type==="added"&&c.doc.data().status==="new"))beep();
    S.firstOrders=false;
    S.orders=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));render()},err=>{console.error(err)})}

onSnapshot(dref("config/main"),s=>{S.config=Object.assign({},DEF,s.exists()?s.data():{});S.got.c=true;render()},err=>{console.error(err);S.got.c=true;render()});
onSnapshot(col("menu"),s=>{S.menu=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.sort||0)-(b.sort||0));S.got.m=true;render()},err=>{console.error(err);S.got.m=true;render()});
function subContacts(on){if(S.contactsUnsub){S.contactsUnsub();S.contactsUnsub=null}S.contacts={};if(!on)return;
  S.contactsUnsub=onSnapshot(col("contacts"),s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.contacts=m;render()},err=>console.error(err))}
async function ensureDrinks(){if(S.drinksTried||!isStaff()||!S.got.c||!S.got.m||!S.menu.length||S.config.seedDrinks)return;S.drinksTried=true;
  try{const b=writeBatch(fs);DRINKS.forEach(([id,name,price],i)=>b.set(dref("menu/"+id),{cat:"เครื่องดื่ม",name,price,available:true,sort:100000+i}));b.set(dref("config/main"),{seedDrinks:true},{merge:true});await b.commit();toast("เพิ่มหมวดเครื่องดื่มแล้ว")}catch(e){console.error(e)}}
setInterval(ensureDrinks,2000);
onAuthStateChanged(auth,u=>{S.user=u;S.authReady=true;subContacts(!!u);
  if(!u&&S.salesUnsub){S.salesUnsub();S.salesUnsub=null;S.salesFor=null;S.sales=[]}
  subOrders();if(u&&S.view==="report")subSales();render()});

let wasExpired=false;
setInterval(()=>{if(!S.customer)return;const left=custLeft();if(left===Infinity)return;
  if(left<=0){if(!wasExpired){wasExpired=true;S.sheet=null;S.cart=[];render()}return}
  wasExpired=false;["ctime","ctime2"].forEach(id=>{const el=document.getElementById(id);if(el){el.textContent=mmss(left);const box=el.parentNode;if(left<60000&&!box.classList.contains("low"))box.classList.add("low")}})},1000);
setInterval(()=>{if(!S.sheet&&isStaff()&&!S.customer&&(S.view==="kitchen"||S.view==="pos")){const ae=document.activeElement;if(!ae||!/INPUT/.test(ae.tagName))render()}},15000);
</script>
